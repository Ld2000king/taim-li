<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Miriam+Libre:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0E7C7B; } a:hover { color: #0A6160; }
    .press { transition: transform .12s ease, opacity .12s ease; }
    .press:active { transform: scale(.97); opacity: .9; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFBF9; font-family: Heebo, system-ui, sans-serif; color: #14181A; padding: 36px 24px 32px; display: flex; flex-direction: column; overflow: hidden;">

  <!-- top row -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M2 20h20"></path></svg>
      <span style="font-size: 17px; font-weight: 600;">לעבוד כמה שעות</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E7579" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; color: #565D61;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#565D61" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 15px; font-weight: 600;">1</span>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <!-- when: quiet segmented control -->
  <div style="display: flex; gap: 4px; background: #F5F3EF; border-radius: 999px; padding: 4px;">
    <sc-for list="{{whens}}" as="w" hint-placeholder-count="3">
      <div onClick="{{ w.pick }}" class="press" style="flex: 1; text-align: center; border-radius: 999px; padding: 11px 6px; font-size: 15px; cursor: pointer; background: {{ w.bg }}; color: {{ w.fg }}; font-weight: {{ w.fw }}; box-shadow: {{ w.sh }};">{{ w.label }}</div>
    </sc-for>
  </div>

  <div style="height: 26px;"></div>

  <!-- offer card -->
  <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(23,23,26,.04), 0 10px 30px rgba(23,23,26,.06); overflow: hidden;">

    <div style="position: relative; height: 156px; background: #E4F1F0; display: flex; align-items: center; justify-content: center;">
      <svg width="86" height="86" viewBox="0 0 64 64" fill="none" stroke="{{ accent }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 26h32v13a13 13 0 0 1-13 13h-6a13 13 0 0 1-13-13z"></path>
        <path d="M45 30h4a6 6 0 0 1 0 12h-4"></path>
        <path d="M10 57h44"></path>
        <path d="M24 10c-2 3 2 5 0 8"></path>
        <path d="M34 8c-2 3 2 5 0 8"></path>
      </svg>

      <div style="position: absolute; top: 14px; inset-inline-end: 14px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 7px 12px; box-shadow: 0 1px 3px rgba(23,23,26,.10);">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #D6246E;"></span>
        <span style="font-size: 15px; font-weight: 700; color: #14181A;">51:38</span>
      </div>

      <div style="position: absolute; top: 16px; inset-inline-start: 16px; font-size: 13px; font-weight: 600; color: #565D61;">4 מקומות</div>
    </div>

    <div style="padding: 22px 22px 24px; display: flex; flex-direction: column;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.6px; color: #6E7579;">הצעה</div>
      <div style="height: 8px;"></div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-family: 'Miriam Libre', Heebo, sans-serif; font-weight: 700; font-size: 46px; line-height: 1;">20%</span>
        <span style="font-size: 17px; font-weight: 500; color: #14181A;">על כל התפריט</span>
      </div>
      <div style="height: 8px;"></div>
      <div style="font-size: 14.5px; color: #565D61;">ישיבה בחוץ מתחת לפיקוסים</div>

      <div style="height: 1px; background: #EAE7E1; margin: 20px 0;"></div>

      <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
        <span style="font-size: 17px; font-weight: 700;">בזלת קפה</span>
        <span style="font-size: 14.5px; color: #565D61;">4 דק׳ הליכה</span>
      </div>
      <div style="height: 10px;"></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        <span style="font-size: 14px; color: #565D61;">עבודה מהלפטופ · שקט</span>
      </div>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <!-- actions -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <div class="press" style="width: 58px; height: 58px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,23,26,.05), 0 6px 16px rgba(23,23,26,.06); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565D61" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </div>
    <div onClick="{{ take }}" class="press" style="flex: 1; height: 58px; border-radius: 999px; background: {{ takeBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; font-size: 17px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      {{ takeLabel }}
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0E7C7B","options":["#0E7C7B","#0A6160","#D6246E","#5B6E8C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const when = st.when || 'now';
    const taken = !!st.taken;
    const accent = this.props.accent ?? '#0E7C7B';

    const defs = [
      { id: 'now',  label: 'עכשיו' },
      { id: 'soon', label: 'בעוד שעה' },
      { id: 'eve',  label: 'הערב' }
    ];

    return {
      accent: accent,
      whens: defs.map((w) => {
        const on = w.id === when;
        return {
          id: w.id,
          label: w.label,
          bg: on ? '#FFFFFF' : 'transparent',
          fg: on ? '#14181A' : '#565D61',
          fw: on ? '600' : '500',
          sh: on ? '0 1px 3px rgba(23,23,26,.10)' : 'none',
          pick: () => this.setState({ when: w.id })
        };
      }),
      take: () => this.setState({ taken: !taken }),
      takeBg: taken ? '#0A6160' : accent,
      takeLabel: taken ? 'שמור לך ל-15 דקות' : 'תפיסת מקום'
    };
  }
}
</script>
</body>
</html>
