<title>(מ)טעים לי · שידור</title>
<meta name="description" content="קונסולת השידור של העסק — מפת השעות המתות, שידור מקומות פנויים בלחיצה, ומעקב חי. גרסת דמו." />

<style>
:root {
    --paper: #FCFBF9;
    --paper-edge: #F2F0EB;
    --card: #FFFFFF;
    --card-2: #F5F3EF;
    --line: #EAE7E1;
    --ink: #14181A;
    --ink-soft: #565D61;
    --ink-faint: #6E7579;
    --teal: #0E7C7B;
    --teal-deep: #0A6160;
    --teal-tint: #E4F1F0;
    --pink: #D6246E;
    --pink-tint: #FCE7EF;
    --shadow-soft: 0 1px 2px rgba(20, 24, 26, .04), 0 8px 24px rgba(20, 24, 26, .06);
    --shadow-lift: 0 2px 6px rgba(20, 24, 26, .05), 0 18px 44px rgba(20, 24, 26, .12);
    --radius-sm: 12px;
    --radius-tile: 16px;
    --radius-card: 22px;
    --radius-frame: 28px;
    --font-display: 'Miriam Libre', Heebo, Georgia, serif;
    --font-ui: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --app-max-width: 460px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: var(--font-ui); background: var(--paper-edge); color: var(--ink);
    overflow: hidden; -webkit-tap-highlight-color: transparent; line-height: 1.55;
}
button { font-family: var(--font-ui); cursor: pointer; }
#app {
    position: relative; direction: rtl; height: 100dvh;
    max-width: var(--app-max-width); margin: 0 auto;
    background: var(--paper); box-shadow: var(--shadow-soft);
    border-radius: var(--radius-frame); overflow: hidden;
    display: flex; flex-direction: column;
}
.tap { transition: transform .14s cubic-bezier(.34,1.56,.64,1), filter .14s ease, background .16s ease; }
.tap:active { transform: scale(.96); filter: brightness(.97); }

/* ---------- broadcast console ---------- */
.bc-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 32px; display: flex; flex-direction: column; gap: 14px; }

.bc-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-card); box-shadow: var(--shadow-soft);
    padding: 18px 16px;
}
.bc-card h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.bc-card .bc-hint { font-size: 13px; color: var(--ink-soft); margin-top: 5px; line-height: 1.55; }

/* --- hero: off --- */
.bc-off { text-align: center; padding: 26px 20px; }
.bc-off .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); margin: 0 auto 12px; }
.bc-off h2 { font-size: 20px; }
.bc-off p { font-size: 13.5px; color: var(--ink-soft); margin-top: 7px; }
.bc-off p b { color: var(--pink); }

/* --- hero: live --- */
.bc-on { background: var(--teal); border-color: transparent; color: #fff; }
.bc-on .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bc-on .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
.bc-on .badge i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: bcPulse 1.2s ease-in-out infinite; }
@keyframes bcPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.bc-on .left { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bc-on .what { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin-top: 12px; }
.bc-on .sub { font-size: 13.5px; opacity: .85; margin-top: 3px; }
.bc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.bc-stat { background: rgba(255,255,255,.16); border-radius: 14px; padding: 11px 6px; text-align: center; }
.bc-stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.bc-stat span { display: block; font-size: 11.5px; opacity: .85; margin-top: 1px; }
.bc-on .acts { display: flex; gap: 8px; margin-top: 16px; }
.bc-on .acts button {
    flex: 1; border: none; border-radius: 13px; padding: 12px;
    font-weight: 700; font-size: 14px;
    background: rgba(255,255,255,.18); color: #fff;
}
.bc-on .acts button.stop { background: #fff; color: var(--teal-deep); }

/* --- composer --- */
.bc-field { margin-top: 16px; }
.bc-field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
.bc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.bc-chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 15px; font-size: 14px; font-weight: 500; color: var(--ink-soft);
}
.bc-chip[aria-pressed="true"] {
    background: var(--teal-tint); border-color: transparent; color: var(--teal-deep); font-weight: 600;
}
.bc-step { display: flex; align-items: center; gap: 14px; }
.bc-step button {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 22px; font-weight: 600;
    display: grid; place-items: center;
}
.bc-step button:disabled { opacity: .35; }
.bc-step .n {
    font-family: var(--font-display); font-weight: 700; font-size: 30px;
    min-width: 48px; text-align: center; font-variant-numeric: tabular-nums;
}
.bc-step .unit { font-size: 14px; color: var(--ink-soft); }

.bc-warn {
    display: flex; gap: 9px; align-items: flex-start;
    background: var(--pink-tint); border-radius: 13px; padding: 12px 13px; margin-top: 16px;
    font-size: 12.5px; color: var(--ink); line-height: 1.5;
}
.bc-warn svg { width: 17px; height: 17px; color: var(--pink); flex-shrink: 0; margin-top: 1px; }

.bc-go {
    width: 100%; margin-top: 18px; border: none; border-radius: 15px;
    background: var(--teal); color: #fff; padding: 16px;
    font-size: 16.5px; font-weight: 700;
}
.bc-again {
    width: 100%; margin-top: 10px; background: none; border: none;
    color: var(--ink-soft); font-size: 13.5px; font-weight: 600; padding: 8px;
}

/* --- heatmap --- */
.bc-grid { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.bc-gh { font-size: 12px; font-weight: 600; color: var(--ink-faint); text-align: center; padding-bottom: 2px; }
.bc-gr {
    font-size: 11px; color: var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    direction: ltr; font-variant-numeric: tabular-nums;
}
.bc-cell {
    min-height: 44px; border-radius: 9px; border: 1.5px solid transparent;
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
}
.bc-cell.c1 { background: #F4F1EC; }
.bc-cell.c2 { background: #E7EFEE; }
.bc-cell.c3 { background: #C3DFDD; }
.bc-cell.c4 { background: #74B9B6; color: #fff; }
.bc-cell.c5 { background: var(--teal); color: #fff; }
.bc-cell.dead { border-color: var(--pink); color: var(--pink); cursor: pointer; }
.bc-cell.picked { background: var(--pink); border-color: var(--pink); color: #fff; }
.bc-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--ink-soft); }
.bc-legend span { display: inline-flex; align-items: center; gap: 6px; }
.bc-legend i { width: 12px; height: 12px; border-radius: 4px; }

/* --- roi --- */
.bc-roi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.bc-roi div b {
    display: block; font-family: var(--font-display); font-weight: 700;
    font-size: 23px; color: var(--teal-deep); font-variant-numeric: tabular-nums;
}
.bc-roi div span { display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

/* --- toast --- */
.toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 170%);
    background: var(--ink); color: var(--paper); font-weight: 600; font-size: 13.5px;
    padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow-lift);
    z-index: 120; max-width: 88vw; text-align: center;
    transition: transform .4s cubic-bezier(.34,1.4,.64,1);
}
.toast.show { transform: translate(-50%, 0); }
.toast b { color: #fff; }

@media (prefers-reduced-motion: reduce) {
    .bc-on .badge i { animation: none; }
    .tap, .toast { transition: none; }
}
</style>

<div id="app" lang="he" dir="rtl">
    <div class="bc-scroll" id="bcScroll">
        <div id="bcHero"></div>

        <section class="bc-card" id="bcComposer">
            <h2>שידור מהיר</h2>
            <p class="bc-hint">פחות מעשר שניות. כל שידור נסגר לבד בסוף החלון.</p>

<script>
(function () {
    "use strict";

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };

    var DAYS = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
    var DEAD = 50;
    var HEAT = [
        { band: '08–11', from: 8,  to: 11, v: [38, 42, 40, 44, 46, 62, 55] },
        { band: '11–14', from: 11, to: 14, v: [70, 78, 74, 80, 88, 92, 85] },
        { band: '14–17', from: 14, to: 17, v: [22, 26, 24, 28, 30, 58, 48] },
        { band: '17–20', from: 17, to: 20, v: [45, 48, 44, 52, 68, 40, 44] },
        { band: '20–23', from: 20, to: 23, v: [58, 62, 60, 70, 88, 30, 35] }
    ];

    var UNTILS = [
        { k: 'h1', label: 'עוד שעה', mins: 60 },
        { k: 'h2', label: 'עוד שעתיים', mins: 120 },
        { k: 'close', label: 'עד הסגירה', mins: 210 }
    ];
    var OFFERS = [
        { k: 'none', label: 'בלי הנחה', text: 'יש מקום עכשיו' },
        { k: '10', label: '10%', text: '10% על כל התפריט' },
        { k: '20', label: '20%', text: '20% על כל התפריט' },
        { k: 'dish', label: 'מנה על הבית', text: 'מנה ראשונה על הבית' }
    ];

    var bc = { seats: 4, untilKey: 'h1', offerKey: '20', picked: null, live: null };

    /* ---------- helpers ---------- */
    function currentBandIndex() {
        var h = new Date().getHours();
        for (var i = 0; i < HEAT.length; i++) if (h >= HEAT[i].from && h < HEAT[i].to) return i;
        return -1;
    }
    function todayOccupancy() {
        var i = currentBandIndex();
        if (i < 0) return null;
        return HEAT[i].v[new Date().getDay()];
    }
    function untilMins() {
        if (bc.picked) return Math.max(30, bc.picked.minsFromNow);
        var u = UNTILS.filter(function (x) { return x.k === bc.untilKey; })[0];
        return u ? u.mins : 60;
    }
    function untilLabel() {
        var end = new Date(Date.now() + untilMins() * 60000);
        return pad(end.getHours()) + ':' + pad(end.getMinutes());
    }
    function offerText() {
        var o = OFFERS.filter(function (x) { return x.k === bc.offerKey; })[0];
        return o ? o.text : 'יש מקום עכשיו';
    }

    /* ---------- hero ---------- */
    function renderHero() {
        var el = $('#bcHero');
        if (!bc.live) {
            var deadCount = 0;
            HEAT.forEach(function (r) { r.v.forEach(function (v) { if (v < DEAD) deadCount++; }); });
            el.innerHTML =
                '<section class="bc-card bc-off">' +
                    '<div class="dot"></div>' +
                    '<h2>לא משדרים כרגע</h2>' +
                    '<p>יש לכם <b>' + deadCount + ' חלונות מתים</b> בשבוע טיפוסי. כל אחד מהם הוא כיסאות שנעלמים.</p>' +
                '</section>';
            return;
        }

        var left = Math.max(0, Math.floor((bc.live.endsAt - Date.now()) / 1000));
        var mm = Math.floor(left / 60), ss = left % 60;
        var leftTxt = mm >= 60
            ? 'עד ' + bc.live.untilLabel
            : pad(mm) + ':' + pad(ss);

        el.innerHTML =
            '<section class="bc-card bc-on">' +
                '<div class="row">' +
                    '<span class="badge"><i></i>משדר עכשיו</span>' +
                    '<span class="left">נותרו ' + leftTxt + '</span>' +
                '</div>' +
                '<div class="what">' + bc.live.offerText + '</div>' +
                '<div class="sub">' + bc.live.seats + ' מקומות · עד ' + bc.live.untilLabel + '</div>' +
                '<div class="bc-stats">' +
                    '<div class="bc-stat"><b>' + bc.live.viewers + '</b><span>רואים</span></div>' +
                    '<div class="bc-stat"><b>' + bc.live.taken + '</b><span>תפסו</span></div>' +
                    '<div class="bc-stat"><b>' + bc.live.arrived + '</b><span>הגיעו</span></div>' +
                '</div>' +
                '<div class="acts">' +
                    '<button class="tap" id="bcExtend" type="button">הארכה ב-30 דק׳</button>' +
                    '<button class="tap stop" id="bcStop" type="button">סיום שידור</button>' +
                '</div>' +
            '</section>';

        $('#bcExtend').addEventListener('click', function () {
            bc.live.endsAt += 30 * 60000;
            var e = new Date(bc.live.endsAt);
            bc.live.untilLabel = pad(e.getHours()) + ':' + pad(e.getMinutes());
            renderHero();
            flash('השידור הוארך עד ' + bc.live.untilLabel);
        });
        $('#bcStop').addEventListener('click', function () {
            var t = bc.live.taken;
            bc.live = null;
            renderHero(); renderComposer();
            flash(t ? 'השידור נסגר · ' + t + ' מקומות נתפסו' : 'השידור נסגר');
        });
    }

    /* ---------- composer ---------- */
    function renderComposer() {
        $('#bcSeats').textContent = bc.seats;
        $('#bcMinus').disabled = bc.seats <= 1;
        $('#bcPlus').disabled = bc.seats >= 12;

        var untils = UNTILS.slice();
        if (bc.picked) untils = [{ k: 'picked', label: 'עד ' + bc.picked.label, mins: bc.picked.minsFromNow }].concat(untils);
        $('#bcUntils').innerHTML = untils.map(function (u) {
            var on = bc.picked ? u.k === 'picked' : u.k === bc.untilKey;
            return '<button class="bc-chip tap" type="button" data-u="' + u.k + '" aria-pressed="' + on + '">' + u.label + '</button>';
        }).join('');
        Array.prototype.forEach.call($('#bcUntils').querySelectorAll('[data-u]'), function (b) {
            b.addEventListener('click', function () {
                var k = b.getAttribute('data-u');
                if (k !== 'picked') { bc.picked = null; bc.untilKey = k; }
                renderComposer(); renderGrid();
            });
        });

        $('#bcOffers').innerHTML = OFFERS.map(function (o) {
            return '<button class="bc-chip tap" type="button" data-o="' + o.k + '" aria-pressed="' + (o.k === bc.offerKey) + '">' + o.label + '</button>';
        }).join('');
        Array.prototype.forEach.call($('#bcOffers').querySelectorAll('[data-o]'), function (b) {
            b.addEventListener('click', function () { bc.offerKey = b.getAttribute('data-o'); renderComposer(); });
        });

        // integrity guard: never let a discount run during a busy window
        var occ = todayOccupancy();
        var busy = occ !== null && occ >= DEAD && bc.offerKey !== 'none' && !bc.picked;
        $('#bcWarn').innerHTML = busy
            ? '<div class="bc-warn">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>' +
                '<span>השעה הזו לא מתה אצלכם (' + occ + '% תפוסה בממוצע). הנחה עכשיו תוזיל ביקוש שממילא היה מגיע — עדיף ״בלי הנחה״, או לשדר לחלון מת.</span>' +
              '</div>'
            : '';

        $('#bcGo').textContent = bc.live ? 'עדכון השידור' : 'שידור עכשיו';
    }

    $('#bcMinus').addEventListener('click', function () { if (bc.seats > 1) { bc.seats--; renderComposer(); } });
    $('#bcPlus').addEventListener('click', function () { if (bc.seats < 12) { bc.seats++; renderComposer(); } });

    $('#bcGo').addEventListener('click', function () {
        var mins = untilMins();
        var end = new Date(Date.now() + mins * 60000);
        bc.live = {
            seats: bc.seats,
            offerText: offerText(),
            untilLabel: pad(end.getHours()) + ':' + pad(end.getMinutes()),
            endsAt: end.getTime(),
            viewers: 0, taken: 0, arrived: 0
        };
        bc.picked = null;
        renderHero(); renderComposer(); renderGrid();
        $('#bcScroll').scrollTo({ top: 0, behavior: 'smooth' });
        flash('השידור עלה · לקוחות בסביבה רואים אתכם עכשיו');
    });

    $('#bcAgain').addEventListener('click', function () {
        bc.seats = 4; bc.offerKey = '20'; bc.untilKey = 'h2'; bc.picked = null;
        renderComposer();
        flash('מולא לפי שלישי שעבר — אפשר לשדר');
    });

    /* ---------- heatmap ---------- */
    function cellClass(v) {
        if (v < 35) return 'c1';
        if (v < 50) return 'c2';
        if (v < 70) return 'c3';
        if (v < 85) return 'c4';
        return 'c5';
    }
    function renderGrid() {
        var html = '<div></div>';
        DAYS.forEach(function (d) { html += '<div class="bc-gh">' + d + '</div>'; });
        HEAT.forEach(function (row, ri) {
            html += '<div class="bc-gr">' + row.band + '</div>';
            row.v.forEach(function (v, di) {
                var dead = v < DEAD;
                var pickedHere = bc.picked && bc.picked.ri === ri && bc.picked.di === di;
                html += '<div class="bc-cell ' + cellClass(v) + (dead ? ' dead' : '') + (pickedHere ? ' picked' : '') + '"' +
                    (dead ? ' data-ri="' + ri + '" data-di="' + di + '" role="button" tabindex="0"' : '') +
                    '>' + v + '</div>';
            });
        });
        $('#bcGrid').innerHTML = html;

        Array.prototype.forEach.call($('#bcGrid').querySelectorAll('[data-ri]'), function (c) {
            c.addEventListener('click', function () {
                var ri = +c.getAttribute('data-ri'), di = +c.getAttribute('data-di');
                var row = HEAT[ri];
                var now = new Date();
                var end = new Date(now);
                end.setHours(row.to, 0, 0, 0);
                var mins = Math.round((end - now) / 60000);
                if (mins < 30) mins = 90;   // that window is not today any more
                bc.picked = { ri: ri, di: di, label: pad(row.to) + ':00', minsFromNow: mins };
                renderComposer(); renderGrid();
                $('#bcComposer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                flash('חלון נבחר · יום ' + DAYS[di] + '׳ ' + row.band + ' · ' + row.v[di] + '% תפוסה');
            });
        });
    }

    /* ---------- live ticker ---------- */
    var tick = 0;
    setInterval(function () {
        if (!bc.live) return;
        tick++;

        if (Date.now() >= bc.live.endsAt) {
            var t = bc.live.taken;
            bc.live = null;
            renderHero(); renderComposer();
            flash(t ? 'השידור הסתיים · ' + t + ' מקומות נתפסו' : 'השידור הסתיים');
            return;
        }

        if (tick % 2 === 0 && bc.live.viewers < 26) {
            bc.live.viewers += 1 + (Math.random() < 0.4 ? 1 : 0);
        }
        if (tick % 9 === 0 && bc.live.taken < bc.live.seats && Math.random() < 0.65) {
            bc.live.taken++;
            flash('מישהו תפס מקום · נשארו ' + (bc.live.seats - bc.live.taken));
        }
        if (tick % 14 === 0 && bc.live.arrived < bc.live.taken) bc.live.arrived++;

        renderHero();
    }, 1000);

    /* ---------- toast ---------- */
    var tt;
    function flash(msg) {
        var el = $('#toast');
        el.innerHTML = msg;
        el.classList.add('show');
        clearTimeout(tt);
        tt = setTimeout(function () { el.classList.remove('show'); }, 2800);
    }

    renderHero();
    renderComposer();
    renderGrid();
})();
</script>
