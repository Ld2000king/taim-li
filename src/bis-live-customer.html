<meta name="description" content="צד הלקוח החדש: נכנסים לפי סיטואציה, רואים רק הצעות חיות עם שעון מתקתק, ותופסים מקום. גרסת דמו." />

<style>
/* ============================================================================
   (מ)טעים לי · פנוי עכשיו — situation-first, expiring-offer deck.
   Same "יום־יום" tokens as the rest of the product family.
   ============================================================================ */
:root {
    /* ---- "נקי" — warm-neutral ground, never cold grey ---- */
    --paper: #FCFBF9;
    --paper-edge: #F2F0EB;
    --card: #FFFFFF;
    --card-2: #F5F3EF;
    --line: #EAE7E1;

    /* ---- ink: every step clears 4.5:1 on white ---- */
    --ink: #14181A;
    --ink-soft: #565D61;
    --ink-faint: #6E7579;

    /* ---- exactly two hues carry the whole app ---- */
    --teal: #0E7C7B;        /* primary · positive · confirmed */
    --teal-deep: #0A6160;
    --teal-tint: #E4F1F0;
    --pink: #D6246E;        /* urgency · expiring · destructive */
    --pink-tint: #FCE7EF;

    /* ---- old role names remapped onto the two hues ---- */
    --sage: var(--teal);
    --sage-tint: var(--teal-tint);
    --clay: var(--teal);
    --clay-deep: var(--teal-deep);
    --clay-tint: var(--teal-tint);
    --honey: var(--pink);
    --honey-tint: var(--pink-tint);
    --plum: var(--ink-soft);       /* tags go neutral — this is most of the de-cluttering */
    --plum-tint: var(--card-2);
    --plum-line: var(--line);
    --rose: var(--pink);
    --rose-tint: var(--pink-tint);

    --shadow-soft: 0 1px 2px rgba(20, 24, 26, .04), 0 8px 24px rgba(20, 24, 26, .06);
    --shadow-lift: 0 2px 6px rgba(20, 24, 26, .05), 0 18px 44px rgba(20, 24, 26, .12);
    --shadow-depth-sm: var(--shadow-soft);
    --shadow-depth-md: var(--shadow-soft);
    --shadow-depth-lg: var(--shadow-lift);
    --glow-green: var(--shadow-soft);
    --glow-gold: var(--shadow-soft);

    --radius-sm: 12px;
    --radius-tile: 16px;
    --radius-btn: 14px;
    --radius-card: 22px;
    --radius-frame: 28px;

    --font-display: 'Miriam Libre', Heebo, Georgia, serif;
    --font-ui: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --app-max-width: 460px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: var(--font-ui); background: var(--paper-edge); color: var(--ink);
    overflow: hidden; -webkit-tap-highlight-color: transparent; line-height: 1.55;
}
button { font-family: var(--font-ui); cursor: pointer; }
#app {
    position: relative; direction: rtl; height: 100dvh;
    max-width: var(--app-max-width); margin: 0 auto;
    background: var(--paper); box-shadow: var(--shadow-soft);
    border-radius: var(--radius-frame); overflow: hidden;
    display: flex; flex-direction: column;
}
.tap { transition: transform .14s cubic-bezier(.34,1.56,.64,1), filter .14s ease, background .16s ease, border-color .16s ease; }
.tap:active { transform: scale(.96); filter: brightness(.97); }

.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.active { display: flex; }

/* ---------- screen A: situation picker ---------- */
.pick { flex: 1; overflow-y: auto; padding: 34px 22px 28px; }
.pick .word {
    font-family: var(--font-display); font-weight: 700; font-size: 24px;
    color: var(--clay-deep); margin-bottom: 26px;
}
.pick h1 {
    font-family: var(--font-display); font-weight: 700; font-size: 30px;
    line-height: 1.25; margin-bottom: 8px; text-wrap: balance;
}
.pick .sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 24px; text-wrap: pretty; }
.sit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.sit {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-tile); padding: 16px 14px;
    text-align: start; display: flex; flex-direction: column; gap: 8px;
    min-height: 108px;
}
.sit:hover { border-color: var(--clay); }
.sit svg { width: 24px; height: 24px; color: var(--clay-deep); }
.sit b { font-size: 15px; font-weight: 700; display: block; }
.sit span { font-size: 11.5px; color: var(--ink-faint); }
.pick .foot { margin-top: 22px; font-size: 12px; color: var(--ink-faint); text-align: center; }

/* ---------- screen B: feed ---------- */
.bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
}
.sit-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--clay-tint); border: 1px solid #E7CDBA;
    border-radius: 999px; padding: 7px 14px 7px 11px;
    font-size: 13.5px; font-weight: 600; color: var(--clay-deep);
}
.sit-chip svg { width: 15px; height: 15px; }
.holds-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
}
.holds-pill svg { width: 15px; height: 15px; }
.holds-pill.hot { background: var(--sage-tint); border-color: #D6E4D8; color: var(--sage); }

.when {
    flex-shrink: 0; display: flex; gap: 8px; padding: 11px 16px;
}
.wbtn {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 6px;
    font-size: 13px; font-weight: 500; color: var(--ink-soft);
}
.wbtn[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600;
}

.stage { flex: 1; position: relative; padding: 6px 16px 4px; min-height: 0; }
.card {
    position: absolute; top: 6px; inset-inline: 16px; bottom: 4px;
    background: var(--card); border-radius: var(--radius-card);
    overflow: hidden; box-shadow: var(--shadow-lift);
    will-change: transform; user-select: none; -webkit-user-select: none;
}
.card.behind-1 { transform: scale(.955) translateY(10px); }
.card.behind-2 { transform: scale(.912) translateY(18px); }
.card.settling { transition: transform .32s cubic-bezier(.22,1,.36,1); }
.card.top { touch-action: none; cursor: grab; }
.card.gone { transition: transform .36s ease, opacity .36s ease; opacity: 0; }

.c-media { position: absolute; inset: 0; background: var(--card-2); }
.c-media svg { width: 100%; height: 100%; display: block; }
.c-media::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(38,33,27,.94) 0%, rgba(38,33,27,.42) 46%, rgba(38,33,27,0) 66%);
}
.c-chips {
    position: absolute; top: 13px; inset-inline: 14px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.t-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--honey); color: var(--ink);
    font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(38,33,27,.22);
}
.t-chip svg { width: 14px; height: 14px; }
.t-chip.warn { background: var(--rose); color: #fff; animation: beat 1s ease-in-out infinite; }
.t-chip.later { background: rgba(251,248,243,.92); color: var(--ink-soft); font-weight: 600; }
@keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.s-chip {
    background: rgba(38,33,27,.55); color: #fff;
    font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px;
    backdrop-filter: blur(4px);
}

.c-body { position: absolute; inset-inline: 0; bottom: 0; z-index: 2; padding: 18px 18px 20px; color: #fff; }
.c-eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1px;
    color: #FFD98F; margin-bottom: 5px;
}
.c-offer {
    font-family: var(--font-display); font-weight: 700; font-size: 27px;
    line-height: 1.2; text-wrap: balance;
}
.c-note { font-size: 12.5px; color: #E9E1D3; margin-top: 3px; }
.c-venue {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    margin-top: 13px; font-size: 14px; font-weight: 600;
}
.c-venue .dot { opacity: .5; }
.c-venue .walk { color: #EFE7DA; font-weight: 500; }
.c-fit {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.16); color: #fff;
    padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(3px);
}
.c-fit svg { width: 13px; height: 13px; color: #A9E0B8; flex-shrink: 0; }

.stamp {
    position: absolute; top: 74px; z-index: 4;
    font-family: var(--font-display); font-weight: 700; font-size: 25px;
    padding: 6px 16px; border-radius: 12px; border: 3px solid currentColor;
    opacity: 0; pointer-events: none;
}
.stamp.yes { inset-inline-start: 22px; transform: rotate(-14deg); color: #57C97E; }
.stamp.no { inset-inline-end: 22px; transform: rotate(14deg); color: #E6E1D6; }

.acts { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 20px; padding: 12px 0 18px; }
.act { border: none; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow-lift); }
.act svg { width: 24px; height: 24px; }
.act.no { width: 56px; height: 56px; color: var(--rose); }
.act.info { width: 46px; height: 46px; color: var(--ink-faint); }
.act.yes { width: 68px; height: 68px; background: var(--sage); color: #fff; }
.act.yes svg { width: 30px; height: 30px; }
.act:disabled { opacity: .4; box-shadow: var(--shadow-soft); }

/* ---------- empty ---------- */
.empty {
    position: absolute; inset: 6px 16px 4px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-card); box-shadow: var(--shadow-soft);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px; gap: 13px;
}
.empty svg.big { width: 50px; height: 50px; color: var(--ink-faint); }
.empty h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.empty p { font-size: 13.5px; color: var(--ink-soft); max-width: 270px; text-wrap: pretty; }
.empty .btn {
    background: var(--clay-deep); color: #fff; border: none;
    border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 14px;
}
.empty .btn.ghost { background: var(--card-2); color: var(--ink-soft); }
.empty .wait {
    display: flex; align-items: center; gap: 9px;
    background: var(--honey-tint); border: 1px solid #EFDFC0;
    border-radius: 14px; padding: 12px 14px; margin-top: 4px;
    font-size: 12.5px; color: var(--ink); text-align: start;
}
.empty .wait svg { width: 18px; height: 18px; color: var(--clay-deep); flex-shrink: 0; }
.empty .wait.on { background: var(--sage-tint); border-color: #D6E4D8; }
.empty .wait.on svg { color: var(--sage); }

/* ---------- hold modal ---------- */
.modal-wrap {
    position: fixed; inset: 0; z-index: 80; background: rgba(47,42,35,.5);
    backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 24px;
}
.modal-wrap.show { display: flex; }
.modal {
    background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow-lift);
    padding: 26px 22px 20px; text-align: center; max-width: 340px; width: 100%;
}
.modal .spark {
    width: 62px; height: 62px; margin: 0 auto 15px; border-radius: 50%;
    background: var(--sage-tint); color: var(--sage); display: grid; place-items: center;
}
.modal .spark svg { width: 32px; height: 32px; }
.modal h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.modal .what { font-size: 14px; color: var(--ink); margin-top: 8px; font-weight: 600; }
.modal .where { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.arrive {
    background: var(--honey-tint); border: 1px solid #EFDFC0; border-radius: 16px;
    padding: 14px; margin-top: 16px;
}
.arrive .lbl { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
.arrive .num {
    font-family: var(--font-display); font-weight: 700; font-size: 32px;
    font-variant-numeric: tabular-nums; color: var(--clay-deep); line-height: 1.1; margin-top: 2px;
}
.code {
    margin-top: 12px; font-size: 13px; color: var(--ink-soft);
}
.code b {
    font-family: var(--font-ui); font-weight: 700; color: var(--ink);
    background: var(--card-2); border-radius: 8px; padding: 3px 9px;
    letter-spacing: .5px; margin-inline-start: 4px;
}
.modal-btns { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
.modal-btns button { border-radius: 999px; padding: 13px; font-weight: 700; font-size: 14px; border: none; }
.modal-btns .primary { background: var(--clay-deep); color: #fff; }
.modal-btns .ghost { background: var(--card-2); color: var(--ink-soft); }

/* ---------- holds tray ---------- */
.tray-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(47,42,35,.42); display: none; }
.tray-wrap.show { display: block; }
.tray {
    position: absolute; inset-inline: 0; bottom: 0;
    max-width: var(--app-max-width); margin: 0 auto;
    background: var(--paper); border-radius: 24px 24px 0 0; max-height: 76%;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .34s cubic-bezier(.22,1,.36,1);
}
.tray-wrap.show .tray { transform: translateY(0); }
.grip { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 10px auto 4px; }
.tray-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 12px; }
.tray-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.tray-head button { background: none; border: none; color: var(--ink-soft); font-size: 14px; font-weight: 600; }
.tray-list { overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.hold {
    display: flex; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-tile); padding: 12px;
}
.hold.dead { opacity: .55; }
.hold .thumb { width: 52px; height: 52px; border-radius: 13px; overflow: hidden; flex-shrink: 0; background: var(--card-2); }
.hold .thumb svg { width: 100%; height: 100%; display: block; }
.hold .txt { flex: 1; min-width: 0; }
.hold .txt h4 { font-size: 14.5px; font-weight: 700; }
.hold .txt p { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.hold .cd {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
    background: var(--sage-tint); color: var(--sage);
}
.hold .cd.warn { background: var(--rose-tint); color: var(--rose); }
.hold .cd.dead { background: var(--card-2); color: var(--ink-faint); }
.tray-empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 32px 20px; }

/* ---------- toast ---------- */
.toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%,170%);
    background: var(--ink); color: var(--paper); font-weight: 600; font-size: 13.5px;
    padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow-lift);
    z-index: 120; max-width: 88vw; text-align: center;
    transition: transform .4s cubic-bezier(.34,1.4,.64,1);
}
.toast.show { transform: translate(-50%,0); }
.toast b { color: #FFD98F; }

@media (prefers-reduced-motion: reduce) {
    .t-chip.warn { animation: none; }
    .tap, .card.settling, .card.gone, .tray, .toast { transition: none; }
}

/* ============================================================================
   "נקי" pass — structural de-decoration on top of the layout above.
   Fewer filled pills, hairlines instead of heavy borders, one soft shadow.
   ============================================================================ */

/* --- countdowns: a quiet white pill that only turns loud near the end --- */
.t-chip, .card-live, .swipe-live, .inq .stat.pending {
    background: var(--card) !important;
    color: var(--ink) !important;
    box-shadow: 0 1px 3px rgba(20, 24, 26, .12);
    font-weight: 600;
}
.t-chip svg { stroke: var(--pink); color: var(--pink); background: none; }
.card-live i, .swipe-live i { background: var(--pink); }
.t-chip.warn {
    background: var(--pink) !important; color: #fff !important;
}
.t-chip.warn svg { stroke: #fff; }
.t-chip.later { background: var(--card-2) !important; color: var(--ink-soft) !important; box-shadow: none; }

/* --- segmented "when": white pill riding a light track --- */
.when {
    background: var(--card-2);
    border-radius: 999px;
    padding: 4px;
    margin: 11px 16px;
    gap: 4px;
}
.wbtn { background: transparent; border: none; color: var(--ink-soft); font-weight: 500; }
.wbtn[aria-pressed="true"] {
    background: var(--card); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 3px rgba(20, 24, 26, .10);
}

/* --- chips and tags: neutral, hairline, no colour blocks --- */
.chip, .fchip, .sit-chip, .holds-pill, .live-toggle {
    border-color: var(--line);
    box-shadow: none;
}
.chip[aria-pressed="true"] {
    background: var(--teal-tint); border-color: transparent; color: var(--teal-deep);
}
.fchip[aria-pressed="true"] {
    background: var(--teal-tint); border-color: transparent; color: var(--teal-deep);
}
.d-tags span, .inq-liked span {
    background: var(--card-2); border-color: var(--line); color: var(--ink-soft);
}

/* --- price segments: solid teal, white label --- */
.seg[aria-pressed="true"] {
    background: var(--teal); color: #fff; box-shadow: none;
}

/* --- primary actions --- */
.btn.save, .btn-approve, .detail-cta .approve, .empty .btn, .modal-btns .primary, .sheet-cta .send {
    background: var(--teal); color: #fff; box-shadow: none;
}
.act.yes, .circle-btn.like { background: var(--teal); color: #fff; }
.act.no, .circle-btn.nope { color: var(--ink-soft); }
.act.info { color: var(--ink-faint); }
.act, .circle-btn { box-shadow: var(--shadow-soft); }

/* skipping is not destructive — keep it neutral */
.btn-decline, .sheet-cta .pass { color: var(--ink-soft) !important; }

/* --- cards: one soft shadow, hairline, consistent radius --- */
.section, .inq, .photo, .booking, .stat, .hold, .empty, .live-card, .d-map, .sit {
    box-shadow: var(--shadow-soft);
}
.card, .swipe-card { box-shadow: var(--shadow-lift); }
.booking { background: var(--teal-tint); border-color: transparent; }
.live-card { background: var(--card-2); border-color: var(--line); }
.live-card.off { opacity: .55; }

/* --- status pills --- */
.pill.approved, .inq .stat.ok { background: var(--teal-tint); color: var(--teal-deep); }
.pill.pending { background: var(--pink-tint) !important; color: var(--pink) !important; box-shadow: none; }
.pill.declined { background: var(--card-2); color: var(--ink-faint); }

/* --- photo scrims: neutral, not warm brown --- */
.c-media::after {
    background: linear-gradient(to top, rgba(20, 24, 26, .92) 0%, rgba(20, 24, 26, .40) 46%, rgba(20, 24, 26, 0) 66%);
}
.card-media::after, .swipe-media::after {
    background: linear-gradient(to top, rgba(20, 24, 26, .90) 0%, rgba(20, 24, 26, .34) 44%, rgba(20, 24, 26, 0) 64%);
}
.sheet-hero::after { background: linear-gradient(to top, rgba(20, 24, 26, .46), transparent 34%); }
.c-eyebrow, .swipe-body h3 em, .card-name em, .swipe-meta b, .card-meta b, .toast b { color: #FFFFFF; }
.c-eyebrow { opacity: .82; }
.c-fit svg { color: #fff; stroke: #fff; }
.card-status.open { color: #B7E6D9; }
.card-status.shut { color: #F3C6D8; }

/* --- the offer line is the one place the display face appears --- */
.c-offer, .swipe-body h3, .card-name, .modal h2, .pick h1 { font-family: var(--font-display); font-weight: 700; }

/* --- swipe stamps --- */
.stamp.yes { color: #35C4A8; }
.stamp.no { color: #E8E5DE; }

/* --- hold sheet --- */
.arrive { background: var(--card-2); border-color: var(--line); }
.arrive .num { color: var(--teal-deep); }
.hold .cd { background: var(--teal-tint); color: var(--teal-deep); }
.hold .cd.warn { background: var(--pink-tint); color: var(--pink); }
.hold .cd.dead { background: var(--card-2); color: var(--ink-faint); }
.empty .wait { background: var(--card-2); border-color: var(--line); }
.empty .wait svg { color: var(--ink-soft); }
.empty .wait.on { background: var(--teal-tint); border-color: transparent; }
.empty .wait.on svg { color: var(--teal); }

/* --- business app bits --- */
.progress-fill { background: var(--teal); }
.progress-label b { color: var(--teal-deep); }
.section-head .idx { color: var(--teal); }
.add-row { background: var(--teal-tint); color: var(--teal-deep); border-color: transparent; }
.switch[aria-checked="true"] { background: var(--teal); }
.dish-price, .swipe-dish span:last-child, .d-dish .p { color: var(--teal-deep) !important; }

    var SEEDS = [
        { biz: 'bazelet',  startsIn: -12, lasts: 64,  seats: 4, eyebrow: 'הצעה', offer: '20% על כל התפריט', note: 'ישיבה בחוץ מתחת לפיקוסים', photo: 'storefront', fits: ['work', 'dog'] },
        { biz: 'bazelet',  startsIn: -5,  lasts: 31,  seats: 2, eyebrow: 'על הבית', offer: 'קפה שני על הבית', note: 'שני מקומות בפינת הלפטופ', photo: 'coffee', fits: ['work'] },
        { biz: 'seven',    startsIn: -20, lasts: 38,  seats: 6, eyebrow: 'מבצע', offer: 'מנת בוקר זוגית ₪79', note: 'במקום ₪92 · כולל שתייה', photo: 'shakshuka', fits: ['family', 'dog'] },
        { biz: 'bowls',    startsIn: 0,   lasts: 90,  seats: 3, eyebrow: 'על הבית', offer: 'שייק ירוק על הבית', note: 'עם כל קערה · שקע בכל שולחן', photo: 'bowl', fits: ['work', 'quick'] },
        { biz: 'lehem',    startsIn: -8,  lasts: 43,  seats: 8, eyebrow: 'סוף היום', offer: 'סל מאפים ₪25', note: 'במקום ₪48 · טייק אווי', photo: 'croissant', fits: ['quick'] },
        { biz: 'nonna',    startsIn: 45,  lasts: 95,  seats: 4, eyebrow: 'הצעה', offer: '15% על כל התפריט', note: 'לשולחנות שמגיעים מוקדם', photo: 'pasta', fits: ['family', 'date'] },
        { biz: 'nonna',    startsIn: 90,  lasts: 140, seats: 2, eyebrow: 'על הבית', offer: 'מנה ראשונה על הבית', note: 'שני מקומות בבר המטבח', photo: 'wine', fits: ['date'] },
        { biz: 'hamtzutz', startsIn: 120, lasts: 200, seats: 5, eyebrow: 'האפי האוור', offer: 'כוס יין ₪24', note: 'במקום ₪34 · מוארך עד הסגירה', photo: 'wine', fits: ['drinks', 'date'] }
    ];

    var WHENS = [
        { id: 'now',     label: 'עכשיו',    offsetMin: 0 },
        { id: 'soon',    label: 'בעוד שעה', offsetMin: 60 },
        { id: 'evening', label: 'הערב',     offsetMin: 180 }
    ];

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var hhmm = function (d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

    /* ---------- state ---------- */
    var boot = new Date();
    var offers = SEEDS.map(function (s, i) {
        var from = new Date(boot.getTime() + s.startsIn * 60000);
        return {
            id: 'o' + i, bizId: s.biz, biz: BIZ[s.biz],
            from: from, until: new Date(from.getTime() + s.lasts * 60000),
            seats: s.seats, eyebrow: s.eyebrow, offer: s.offer, note: s.note,
            photo: s.photo, fits: s.fits
        };
    });

    var situation = null;
    var whenId = 'now';
    var acted = {};
    var holds = [];
    var deck = [];
    var waiting = false;
    var topCard = null;

    function targetTime() {
        var w = WHENS.filter(function (x) { return x.id === whenId; })[0];
        return new Date(Date.now() + w.offsetMin * 60000);
    }
    function activeAt(o, t) { return o.from <= t && t < o.until; }
    function fitReasons(o) {
        if (!situation) return [];
        return situation.needs.filter(function (n) { return o.biz.tags.indexOf(n) !== -1; });
    }
    function matches(o) {
        if (!situation) return false;
        return o.fits.indexOf(situation.id) !== -1 || fitReasons(o).length > 0;
    }
    function buildDeck() {
        var t = targetTime();
        deck = offers.filter(function (o) {
            return !acted[o.id] && o.until > new Date() && activeAt(o, t) && matches(o);
        }).sort(function (a, b) { return a.until - b.until; });
        renderDeck();
    }
    function otherBucketWithOffers() {
        for (var i = 0; i < WHENS.length; i++) {
            if (WHENS[i].id === whenId) continue;
            var t = new Date(Date.now() + WHENS[i].offsetMin * 60000);
            var any = offers.some(function (o) {
                return !acted[o.id] && o.until > new Date() && activeAt(o, t) && matches(o);
            });
            if (any) return WHENS[i];
        }
        return null;
    }

    /* ---------- screen A ---------- */
    function renderSituations() {
        $('#sitGrid').innerHTML = SITUATIONS.map(function (s) {
            return '<button class="sit tap" type="button" data-sit="' + s.id + '">' +
                s.icon + '<div><b>' + s.label + '</b><span>' + s.hint + '</span></div></button>';
        }).join('');
        Array.prototype.forEach.call($('#sitGrid').querySelectorAll('[data-sit]'), function (b) {
            b.addEventListener('click', function () { chooseSituation(b.getAttribute('data-sit')); });
        });
    }
    function chooseSituation(id) {
        situation = SITUATIONS.filter(function (s) { return s.id === id; })[0];
        waiting = false;
        whenId = 'now';   // a new situation always starts from "now"
        $('#sitChip').innerHTML = situation.icon + '<span>' + situation.label + '</span>';
        $('#screenPick').classList.remove('active');
        $('#screenFeed').classList.add('active');
        renderWhen();
        buildDeck();
    }
    function backToPick() {
        $('#screenFeed').classList.remove('active');
        $('#screenPick').classList.add('active');
    }
    $('#sitChip').addEventListener('click', backToPick);
    $('#btnInfo').addEventListener('click', backToPick);

    /* ---------- when strip ---------- */
    function renderWhen() {
        $('#whenRow').innerHTML = WHENS.map(function (w) {
            return '<button class="wbtn tap" type="button" data-w="' + w.id + '" aria-pressed="' + (w.id === whenId) + '">' + w.label + '</button>';
        }).join('');
        Array.prototype.forEach.call($('#whenRow').querySelectorAll('[data-w]'), function (b) {
            b.addEventListener('click', function () {
                whenId = b.getAttribute('data-w');
                waiting = false;
                renderWhen();
                buildDeck();
            });
        });
    }

    /* ---------- timers ---------- */
    function leftText(o) {
        var n = Date.now();
        if (o.from > n) return { cls: 'later', txt: 'נפתח ' + hhmm(o.from) };
        var s = Math.max(0, Math.floor((o.until - n) / 1000));
        var m = Math.floor(s / 60);
        if (m >= 60) return { cls: '', txt: 'עד ' + hhmm(o.until) };
        return { cls: m < 10 ? 'warn' : '', txt: pad(m) + ':' + pad(s % 60) };
    }

    /* ---------- deck ---------- */
    function cardHtml(o) {
        var lt = leftText(o);
        var reasons = fitReasons(o).slice(0, 2);
        var fit = reasons.length
            ? '<div class="c-fit">' + ICON.check + reasons.join(' · ') + '</div>' : '';
        return '' +
            '<div class="c-media">' + ART[o.photo] + '</div>' +
            '<div class="c-chips">' +
                '<div class="t-chip ' + lt.cls + '" data-timer="' + o.id + '">' + ICON.clock + '<span>' + lt.txt + '</span></div>' +
                '<div class="s-chip">' + o.seats + ' מקומות</div>' +
            '</div>' +
            '<div class="stamp yes">תופס!</div>' +
            '<div class="stamp no">לא עכשיו</div>' +
            '<div class="c-body">' +
                '<div class="c-eyebrow">' + o.eyebrow + '</div>' +
                '<div class="c-offer">' + o.offer + '</div>' +
                '<div class="c-note">' + o.note + '</div>' +
                '<div class="c-venue">' + o.biz.name + '<span class="dot">·</span><span class="walk">' + o.biz.walk + ' דק׳ הליכה</span></div>' +
                fit +
            '</div>';
    }
    function renderDeck() {
        var stage = $('#stage');
        stage.innerHTML = '';
        if (!deck.length) { renderEmpty(); syncActs(); return; }
        var shown = deck.slice(0, 3);
        for (var i = shown.length - 1; i >= 0; i--) {
            var el = document.createElement('div');
            el.className = 'card' + (i === 0 ? ' top' : i === 1 ? ' behind-1' : ' behind-2');
            el.innerHTML = cardHtml(shown[i]);
            stage.appendChild(el);
        }
        topCard = stage.querySelector('.card.top');
        attachDrag(topCard);
        syncActs();
    }
    function renderEmpty() {
        var alt = otherBucketWithOffers();
        var el = document.createElement('div');
        el.className = 'empty';
        el.innerHTML =
            '<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
            '<h2>אין כרגע מה לתפוס</h2>' +
            '<p>לא נפתחו הצעות ל״' + situation.label + '״ בזמן הזה. זה משתנה כל כמה דקות.</p>' +
            (alt ? '<button class="btn tap" id="jumpAlt" type="button">יש הצעות ' + alt.label + ' →</button>' : '') +
            '<div class="wait' + (waiting ? ' on' : '') + '" id="waitBox">' + ICON.bell +
                '<span>' + (waiting
                    ? 'מצב המתנה פעיל — נודיע לך ברגע שמשהו מתאים ייפתח.'
                    : 'להפעיל מצב המתנה? נודיע לך ברגע שמשהו מתאים ייפתח.') + '</span>' +
            '</div>' +
            '<button class="btn ghost tap" id="changeSit" type="button">החלפת סיטואציה</button>';
        $('#stage').appendChild(el);
        if (alt) $('#jumpAlt').addEventListener('click', function () {
            whenId = alt.id; renderWhen(); buildDeck();
        });
        $('#waitBox').addEventListener('click', function () {
            waiting = !waiting;
            renderDeck();
            flash(waiting ? 'מצב המתנה פעיל · נודיע לך' : 'מצב המתנה כובה');
        });
        $('#changeSit').addEventListener('click', backToPick);
    }
    function syncActs() {
        var has = deck.length > 0;
        $('#btnNo').disabled = !has;
        $('#btnYes').disabled = !has;
    }

    /* ---------- drag ---------- */
    var drag = null;
    function attachDrag(card) {
        if (!card) return;
        card.addEventListener('pointerdown', function (e) {
            if (e.button != null && e.button !== 0) return;
            drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, t: Date.now(), moved: false };
            card.style.transition = 'none';
            try { card.setPointerCapture(e.pointerId); } catch (err) {}
        });
        card.addEventListener('pointermove', function (e) {
            if (!drag) return;
            drag.dx = e.clientX - drag.x;
            drag.dy = e.clientY - drag.y;
            if (Math.abs(drag.dx) + Math.abs(drag.dy) > 8) drag.moved = true;
            card.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) rotate(' + (drag.dx * .055) + 'deg)';
            setStamp(card, drag.dx);
        });
        function end() {
            if (!drag) return;
            var d = drag; drag = null;
            card.style.transition = '';
            if (d.dx > 108) { fling('yes'); }
            else if (d.dx < -108) { fling('no'); }
            else { snapBack(card); }
        }
        card.addEventListener('pointerup', end);
        card.addEventListener('pointercancel', end);
    }
    function setStamp(card, dx) {
        var y = card.querySelector('.stamp.yes'), n = card.querySelector('.stamp.no');
        var t = Math.min(1, Math.abs(dx) / 90);
        if (dx > 0) { y.style.opacity = t; n.style.opacity = 0; }
        else if (dx < 0) { n.style.opacity = t; y.style.opacity = 0; }
        else { y.style.opacity = 0; n.style.opacity = 0; }
    }
    function snapBack(card) {
        card.classList.add('settling');
        card.style.transform = '';
        setStamp(card, 0);
        setTimeout(function () { card.classList.remove('settling'); }, 340);
    }

    /* ---------- actions ---------- */
    function fling(action) {
        if (!topCard || !deck.length) return;
        var card = topCard, o = deck[0];
        topCard = null;
        var dir = action === 'yes' ? 1 : -1;
        card.classList.add('gone');
        card.style.transform = 'translate(' + (dir * 140) + '%, 40px) rotate(' + (dir * 22) + 'deg)';
        acted[o.id] = action;
        deck = deck.filter(function (x) { return x.id !== o.id; });
        if (action === 'yes') takeHold(o);
        setTimeout(renderDeck, 300);
    }
    $('#btnNo').addEventListener('click', function () { if (deck.length) fling('no'); });
    $('#btnYes').addEventListener('click', function () { if (deck.length) fling('yes'); });
    document.addEventListener('keydown', function (e) {
        if ($('#modalWrap').classList.contains('show') || $('#trayWrap').classList.contains('show')) return;
        if (!$('#screenFeed').classList.contains('active')) return;
        if (e.key === 'ArrowRight' && deck.length) fling('yes');
        else if (e.key === 'ArrowLeft' && deck.length) fling('no');
    });

    /* ---------- holds ---------- */
    function takeHold(o) {
        var h = {
            id: 'h' + Date.now(), offer: o,
            code: 'טעים-' + Math.floor(1000 + Math.random() * 8999),
            until: new Date(Date.now() + 15 * 60000)
        };
        holds.unshift(h);
        refreshHolds();
        $('#mWhat').textContent = o.offer;
        $('#mWhere').textContent = o.biz.name + ' · ' + o.biz.walk + ' דק׳ הליכה · ' + o.seats + ' מקומות';
        $('#mCode').textContent = h.code;
        $('#mCountdown').textContent = '15:00';
        $('#modalWrap').classList.add('show');
    }
    function refreshHolds() {
        var live = holds.filter(function (h) { return h.until > new Date(); }).length;
        $('#holdsCount').textContent = live;
        $('#holdsPill').classList.toggle('hot', live > 0);
    }
    function holdLeft(h) {
        var s = Math.max(0, Math.floor((h.until - Date.now()) / 1000));
        return { s: s, txt: pad(Math.floor(s / 60)) + ':' + pad(s % 60) };
    }
    function renderTray() {
        var list = $('#trayList');
        if (!holds.length) {
            list.innerHTML = '<div class="tray-empty">עדיין לא תפסת מקום. החליקו ימינה על הצעה כדי לשמור אותה ל־15 דקות.</div>';
            return;
        }
        list.innerHTML = holds.map(function (h) {
            var l = holdLeft(h);
            var dead = l.s === 0;
            return '<div class="hold' + (dead ? ' dead' : '') + '">' +
                '<div class="thumb">' + ART[h.offer.photo] + '</div>' +
                '<div class="txt"><h4>' + h.offer.biz.name + '</h4>' +
                    '<p>' + h.offer.offer + ' · קוד ' + h.code + '</p></div>' +
                '<div class="cd ' + (dead ? 'dead' : l.s < 300 ? 'warn' : '') + '" data-hold="' + h.id + '">' +
                    (dead ? 'פג' : l.txt) + '</div>' +
            '</div>';
        }).join('');
    }
    $('#holdsPill').addEventListener('click', function () { renderTray(); $('#trayWrap').classList.add('show'); });
    $('#trayClose').addEventListener('click', function () { $('#trayWrap').classList.remove('show'); });
    $('#trayWrap').addEventListener('click', function (e) {
        if (e.target === $('#trayWrap')) $('#trayWrap').classList.remove('show');
    });
    $('#mNext').addEventListener('click', function () { $('#modalWrap').classList.remove('show'); });
    $('#mHolds').addEventListener('click', function () {
        $('#modalWrap').classList.remove('show');
        renderTray(); $('#trayWrap').classList.add('show');
    });

    /* ---------- one ticker drives every countdown ---------- */
    setInterval(function () {
        var n = Date.now();

        // card timers + prune expired offers out of the deck
        var expired = false;
        deck.forEach(function (o) {
            if (o.until <= n) { expired = true; return; }
            var el = document.querySelector('[data-timer="' + o.id + '"]');
            if (!el) return;
            var lt = leftText(o);
            el.className = 't-chip ' + lt.cls;
            el.querySelector('span').textContent = lt.txt;
        });
        if (expired) {
            deck = deck.filter(function (o) { return o.until > n; });
            flash('הצעה אחת פגה ויצאה מהרשימה');
            renderDeck();
        }

        // hold countdowns
        if (holds.length) {
            holds.forEach(function (h) {
                var el = document.querySelector('[data-hold="' + h.id + '"]');
                var l = holdLeft(h);
                if (el) {
                    el.className = 'cd ' + (l.s === 0 ? 'dead' : l.s < 300 ? 'warn' : '');
                    el.textContent = l.s === 0 ? 'פג' : l.txt;
                }
            });
            if ($('#modalWrap').classList.contains('show') && holds[0]) {
                $('#mCountdown').textContent = holdLeft(holds[0]).txt;
            }
            refreshHolds();
        }
    }, 1000);

    /* ---------- toast ---------- */
    var tt;
    function flash(msg) {
        var t = $('#toast');
        t.innerHTML = msg;
        t.classList.add('show');
        clearTimeout(tt);
        tt = setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    renderSituations();
})();
</script>
