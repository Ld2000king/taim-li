        { biz: 'bazelet',  startsIn: -5,  lasts: 31,  seats: 2, eyebrow: 'על הבית', offer: 'קפה שני על הבית', note: 'שני מקומות בפינת הלפטופ', photo: 'coffee', fits: ['work'] },
        { biz: 'seven',    startsIn: -20, lasts: 38,  seats: 6, eyebrow: 'מבצע', offer: 'מנת בוקר זוגית ₪79', note: 'במקום ₪92 · כולל שתייה', photo: 'shakshuka', fits: ['family', 'dog'] },
        { biz: 'bowls',    startsIn: 0,   lasts: 90,  seats: 3, eyebrow: 'על הבית', offer: 'שייק ירוק על הבית', note: 'עם כל קערה · שקע בכל שולחן', photo: 'bowl', fits: ['work', 'quick'] },
        { biz: 'lehem',    startsIn: -8,  lasts: 43,  seats: 8, eyebrow: 'סוף היום', offer: 'סל מאפים ₪25', note: 'במקום ₪48 · טייק אווי', photo: 'croissant', fits: ['quick'] },
        { biz: 'nonna',    startsIn: 45,  lasts: 95,  seats: 4, eyebrow: 'הצעה', offer: '15% על כל התפריט', note: 'לשולחנות שמגיעים מוקדם', photo: 'pasta', fits: ['family', 'date'] },
        { biz: 'nonna',    startsIn: 90,  lasts: 140, seats: 2, eyebrow: 'על הבית', offer: 'מנה ראשונה על הבית', note: 'שני מקומות בבר המטבח', photo: 'wine', fits: ['date'] },
        { biz: 'hamtzutz', startsIn: 120, lasts: 200, seats: 5, eyebrow: 'האפי האוור', offer: 'כוס יין ₪24', note: 'במקום ₪34 · מוארך עד הסגירה', photo: 'wine', fits: ['drinks', 'date'] }
    ];

    var WHENS = [
        { id: 'now',     label: 'עכשיו',    offsetMin: 0 },
        { id: 'soon',    label: 'בעוד שעה', offsetMin: 60 },
        { id: 'evening', label: 'הערב',     offsetMin: 180 }
    ];

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var hhmm = function (d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

    /* ---------- state ---------- */
    var boot = new Date();
    var offers = SEEDS.map(function (s, i) {
        var from = new Date(boot.getTime() + s.startsIn * 60000);
        return {
            id: 'o' + i, bizId: s.biz, biz: BIZ[s.biz],
            from: from, until: new Date(from.getTime() + s.lasts * 60000),
            seats: s.seats, eyebrow: s.eyebrow, offer: s.offer, note: s.note,
            photo: s.photo, fits: s.fits
        };
    });

    var situation = null;
    var whenId = 'now';
    var acted = {};
    var holds = [];
    var deck = [];
    var waiting = false;
    var topCard = null;

    function targetTime() {
        var w = WHENS.filter(function (x) { return x.id === whenId; })[0];
        return new Date(Date.now() + w.offsetMin * 60000);
    }
    function activeAt(o, t) { return o.from <= t && t < o.until; }
    function fitReasons(o) {
        if (!situation) return [];
        return situation.needs.filter(function (n) { return o.biz.tags.indexOf(n) !== -1; });
    }
    function matches(o) {
        if (!situation) return false;
        return o.fits.indexOf(situation.id) !== -1 || fitReasons(o).length > 0;
    }
    function buildDeck() {
        var t = targetTime();
        deck = offers.filter(function (o) {
            return !acted[o.id] && o.until > new Date() && activeAt(o, t) && matches(o);
        }).sort(function (a, b) { return a.until - b.until; });
        renderDeck();
    }
    function otherBucketWithOffers() {
        for (var i = 0; i < WHENS.length; i++) {
            if (WHENS[i].id === whenId) continue;
            var t = new Date(Date.now() + WHENS[i].offsetMin * 60000);
            var any = offers.some(function (o) {
                return !acted[o.id] && o.until > new Date() && activeAt(o, t) && matches(o);
            });
            if (any) return WHENS[i];
        }
        return null;
    }

    /* ---------- screen A ---------- */
    function liveFor(id) {
        var n = Date.now();
        return offers.filter(function (o) { return o.until > n && (!id || o.fits.indexOf(id) >= 0); }).length;
    }
    /* large title -> compact title in the sticky bar, over the first 60px of scroll */
    (function () {
        var pick = document.querySelector('.pick'), bar = document.querySelector('.pick-top');
        var fade = [document.querySelector('.live-pill'), document.querySelector('.pick h1'), document.querySelector('.pick .sub')];
        pick.addEventListener('scroll', function () {
            var k = Math.max(0, Math.min(1, pick.scrollTop / 60));
            fade.forEach(function (el) { el.style.opacity = 1 - k; el.style.transform = 'translateY(' + (-6 * k) + 'px)'; });
            $('#pickCompact').style.opacity = k;
            bar.classList.toggle('scrolled', k > 0.02);
        }, { passive: true });
    })();

    function renderSituations() {
        $('#liveCount').textContent = offers.filter(function (o) { return activeAt(o, new Date()); }).length;
        $('#sitTotal').textContent = SITUATIONS.length + ' מצבי רוח';
        $('#sitGrid').innerHTML = SITUATIONS.map(function (s, i) {
            var n = liveFor(s.id);
            return '<button class="sit tap" type="button" data-sit="' + s.id + '" style="--h:' + s.hue + ';--i:' + i + '">' +
                '<span class="ico">' + s.icon + '</span>' +
                '<em class="sit-live' + (n ? '' : ' none') + '">' + (n ? n + ' היום' : 'אין כרגע') + '</em>' +
                '<div><b>' + s.label + '</b><span>' + s.hint + '</span></div></button>';
        }).join('');
        Array.prototype.forEach.call($('#sitGrid').querySelectorAll('[data-sit]'), function (b) {
            b.addEventListener('click', function () { chooseSituation(b.getAttribute('data-sit')); });
        });
    }
    function chooseSituation(id) {
        situation = SITUATIONS.filter(function (s) { return s.id === id; })[0];
        waiting = false;
        whenId = 'now';   // a new situation always starts from "now"
        $('#sitChip').innerHTML = situation.icon + '<span>' + situation.label + '</span>';
        $('#screenPick').classList.remove('active');
        $('#screenFeed').classList.add('active');
        renderWhen();
        buildDeck();
    }
    function backToPick() {
        $('#screenFeed').classList.remove('active');
        $('#screenPick').classList.add('active');
    }
    $('#sitChip').addEventListener('click', backToPick);
    $('#btnInfo').addEventListener('click', backToPick);

    /* ---------- when strip ---------- */
    function renderWhen() {
        $('#whenRow').innerHTML = WHENS.map(function (w) {
            return '<button class="wbtn tap" type="button" data-w="' + w.id + '" aria-pressed="' + (w.id === whenId) + '">' + w.label + '</button>';
        }).join('');
        Array.prototype.forEach.call($('#whenRow').querySelectorAll('[data-w]'), function (b) {
            b.addEventListener('click', function () {
                whenId = b.getAttribute('data-w');
                waiting = false;
                renderWhen();
                buildDeck();
            });
        });
    }

    /* ---------- timers ---------- */
    function leftText(o) {
        var n = Date.now();
        if (o.from > n) return { cls: 'later', txt: 'נפתח ' + hhmm(o.from) };
        var s = Math.max(0, Math.floor((o.until - n) / 1000));
        var m = Math.floor(s / 60);
        if (m >= 60) return { cls: '', txt: 'עד ' + hhmm(o.until) };
        return { cls: m < 10 ? 'warn' : '', txt: pad(m) + ':' + pad(s % 60) };
    }

    /* ---------- deck ---------- */
    function cardHtml(o) {
        var lt = leftText(o);
        var reasons = fitReasons(o).slice(0, 2);
        var fit = reasons.length
            ? '<div class="c-fit">' + ICON.check + reasons.join(' · ') + '</div>' : '';
        return '' +
            '<div class="c-media">' + ART[o.photo] + '</div>' +
            '<div class="c-chips">' +
                '<div class="t-chip ' + lt.cls + '" data-timer="' + o.id + '">' + ICON.clock + '<span>' + lt.txt + '</span></div>' +
                '<div class="s-chip">' + o.seats + ' מקומות</div>' +
            '</div>' +
            '<div class="stamp yes">תופס!</div>' +
            '<div class="stamp no">לא עכשיו</div>' +
            '<div class="c-body">' +
                '<div class="c-eyebrow">' + o.eyebrow + '</div>' +
                '<div class="c-offer">' + o.offer + '</div>' +
                '<div class="c-note">' + o.note + '</div>' +
                '<div class="c-venue">' + o.biz.name + '<span class="dot">·</span><span class="walk">' + o.biz.walk + ' דק׳ הליכה</span></div>' +
                fit +
            '</div>';
    }
    function renderDeck() {
        var stage = $('#stage');
        stage.innerHTML = '';
        if (!deck.length) { renderEmpty(); syncActs(); return; }
        var shown = deck.slice(0, 3);
        for (var i = shown.length - 1; i >= 0; i--) {
            var el = document.createElement('div');
            el.className = 'card' + (i === 0 ? ' top' : i === 1 ? ' behind-1' : ' behind-2');
            el.innerHTML = cardHtml(shown[i]);
            stage.appendChild(el);
        }
        topCard = stage.querySelector('.card.top');
        attachDrag(topCard);
        syncActs();
    }
    function renderEmpty() {
        var alt = otherBucketWithOffers();
        var el = document.createElement('div');
        el.className = 'empty';
        el.innerHTML =
            '<svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
            '<h2>אין כרגע מה לתפוס</h2>' +
            '<p>לא נפתחו הצעות ל״' + situation.label + '״ בזמן הזה. זה משתנה כל כמה דקות.</p>' +
            (alt ? '<button class="btn tap" id="jumpAlt" type="button">יש הצעות ' + alt.label + ' →</button>' : '') +
            '<div class="wait' + (waiting ? ' on' : '') + '" id="waitBox">' + ICON.bell +
                '<span>' + (waiting
                    ? 'מצב המתנה פעיל — נודיע לך ברגע שמשהו מתאים ייפתח.'
                    : 'להפעיל מצב המתנה? נודיע לך ברגע שמשהו מתאים ייפתח.') + '</span>' +
            '</div>' +
            '<button class="btn ghost tap" id="changeSit" type="button">החלפת סיטואציה</button>';
        $('#stage').appendChild(el);
        if (alt) $('#jumpAlt').addEventListener('click', function () {
            whenId = alt.id; renderWhen(); buildDeck();
        });
        $('#waitBox').addEventListener('click', function () {
            waiting = !waiting;
            renderDeck();
            flash(waiting ? 'מצב המתנה פעיל · נודיע לך' : 'מצב המתנה כובה');
        });
        $('#changeSit').addEventListener('click', backToPick);
    }
    function syncActs() {
        var has = deck.length > 0;
        $('#btnNo').disabled = !has;
        $('#btnYes').disabled = !has;
    }

    /* ---------- drag ---------- */
    var drag = null;
    function attachDrag(card) {
        if (!card) return;
        card.addEventListener('pointerdown', function (e) {
            if (e.button != null && e.button !== 0) return;
            drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, t: Date.now(), moved: false };
            card.style.transition = 'none';
            try { card.setPointerCapture(e.pointerId); } catch (err) {}
        });
        card.addEventListener('pointermove', function (e) {
            if (!drag) return;
            drag.dx = e.clientX - drag.x;
            drag.dy = e.clientY - drag.y;
            if (Math.abs(drag.dx) + Math.abs(drag.dy) > 8) drag.moved = true;
            card.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) rotate(' + (drag.dx * .055) + 'deg)';
            setStamp(card, drag.dx);
        });
        function end() {
            if (!drag) return;
            var d = drag; drag = null;
            card.style.transition = '';
            if (d.dx > 108) { fling('yes'); }
            else if (d.dx < -108) { fling('no'); }
            else { snapBack(card); }
        }
        card.addEventListener('pointerup', end);
        card.addEventListener('pointercancel', end);
    }
    function setStamp(card, dx) {
        var y = card.querySelector('.stamp.yes'), n = card.querySelector('.stamp.no');
        var t = Math.min(1, Math.abs(dx) / 90);
        if (dx > 0) { y.style.opacity = t; n.style.opacity = 0; }
        else if (dx < 0) { n.style.opacity = t; y.style.opacity = 0; }
        else { y.style.opacity = 0; n.style.opacity = 0; }
    }
    function snapBack(card) {
        card.classList.add('settling');
        card.style.transform = '';
        setStamp(card, 0);
        setTimeout(function () { card.classList.remove('settling'); }, 340);
    }

    /* ---------- actions ---------- */
    function fling(action) {
        if (!topCard || !deck.length) return;
        var card = topCard, o = deck[0];
        topCard = null;
        var dir = action === 'yes' ? 1 : -1;
        card.classList.add('gone');
        card.style.transform = 'translate(' + (dir * 140) + '%, 40px) rotate(' + (dir * 22) + 'deg)';
        acted[o.id] = action;
        deck = deck.filter(function (x) { return x.id !== o.id; });
        if (action === 'yes') takeHold(o);
        setTimeout(renderDeck, 300);
    }
    $('#btnNo').addEventListener('click', function () { if (deck.length) fling('no'); });
    $('#btnYes').addEventListener('click', function () { if (deck.length) fling('yes'); });
    document.addEventListener('keydown', function (e) {
        if ($('#modalWrap').classList.contains('show') || $('#trayWrap').classList.contains('show')) return;
        if (!$('#screenFeed').classList.contains('active')) return;
        if (e.key === 'ArrowRight' && deck.length) fling('yes');
        else if (e.key === 'ArrowLeft' && deck.length) fling('no');
    });

    /* ---------- holds ---------- */
    function takeHold(o) {
        var h = {
            id: 'h' + Date.now(), offer: o,
            code: 'טעים-' + Math.floor(1000 + Math.random() * 8999),
            until: new Date(Date.now() + 15 * 60000)
        };
        holds.unshift(h);
        refreshHolds();
        $('#mWhat').textContent = o.offer;
        $('#mWhere').textContent = o.biz.name + ' · ' + o.biz.walk + ' דק׳ הליכה · ' + o.seats + ' מקומות';
        $('#mCode').textContent = h.code;
        $('#mCountdown').textContent = '15:00';
        $('#modalWrap').classList.add('show');
    }
    function refreshHolds() {
        var live = holds.filter(function (h) { return h.until > new Date(); }).length;
        $('#holdsCount').textContent = live;
        $('#holdsPill').classList.toggle('hot', live > 0);
    }
    function holdLeft(h) {
        var s = Math.max(0, Math.floor((h.until - Date.now()) / 1000));
        return { s: s, txt: pad(Math.floor(s / 60)) + ':' + pad(s % 60) };
    }
    function renderTray() {
        var list = $('#trayList');
        if (!holds.length) {
            list.innerHTML = '<div class="tray-empty">עדיין לא תפסת מקום. החליקו ימינה על הצעה כדי לשמור אותה ל־15 דקות.</div>';
            return;
        }
        list.innerHTML = holds.map(function (h) {
            var l = holdLeft(h);
            var dead = l.s === 0;
            return '<div class="hold' + (dead ? ' dead' : '') + '">' +
                '<div class="thumb">' + ART[h.offer.photo] + '</div>' +
                '<div class="txt"><h4>' + h.offer.biz.name + '</h4>' +
                    '<p>' + h.offer.offer + ' · קוד ' + h.code + '</p></div>' +
                '<div class="cd ' + (dead ? 'dead' : l.s < 300 ? 'warn' : '') + '" data-hold="' + h.id + '">' +
                    (dead ? 'פג' : l.txt) + '</div>' +
            '</div>';
        }).join('');
    }
    $('#holdsPill').addEventListener('click', function () { renderTray(); $('#trayWrap').classList.add('show'); });
    $('#trayClose').addEventListener('click', function () { $('#trayWrap').classList.remove('show'); });
    $('#trayWrap').addEventListener('click', function (e) {
        if (e.target === $('#trayWrap')) $('#trayWrap').classList.remove('show');
    });
    $('#mNext').addEventListener('click', function () { $('#modalWrap').classList.remove('show'); });
    $('#mHolds').addEventListener('click', function () {
        $('#modalWrap').classList.remove('show');
        renderTray(); $('#trayWrap').classList.add('show');
    });

    /* ---------- one ticker drives every countdown ---------- */
    setInterval(function () {
        var n = Date.now();

        // card timers + prune expired offers out of the deck
        var expired = false;
        deck.forEach(function (o) {
            if (o.until <= n) { expired = true; return; }
            var el = document.querySelector('[data-timer="' + o.id + '"]');
            if (!el) return;
            var lt = leftText(o);
            el.className = 't-chip ' + lt.cls;
            el.querySelector('span').textContent = lt.txt;
        });
        if (expired) {
            deck = deck.filter(function (o) { return o.until > n; });
            flash('הצעה אחת פגה ויצאה מהרשימה');
            renderDeck();
        }

        // hold countdowns
        if (holds.length) {
            holds.forEach(function (h) {
                var el = document.querySelector('[data-hold="' + h.id + '"]');
                var l = holdLeft(h);
                if (el) {
                    el.className = 'cd ' + (l.s === 0 ? 'dead' : l.s < 300 ? 'warn' : '');
                    el.textContent = l.s === 0 ? 'פג' : l.txt;
                }
            });
            if ($('#modalWrap').classList.contains('show') && holds[0]) {
                $('#mCountdown').textContent = holdLeft(holds[0]).txt;
            }
            refreshHolds();
        }
    }, 1000);

    /* ---------- toast ---------- */
    var tt;
    function flash(msg) {
        var t = $('#toast');
        t.innerHTML = msg;
        t.classList.add('show');
        clearTimeout(tt);
        tt = setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    renderSituations();
})();
</script>

<script>
(function () {
    var KEY = 'taimli-look';
    var ACCENTS = [
        { hex: '#E64A19', name: 'פפריקה' },
        { hex: '#D81B60', name: 'פטל' },
        { hex: '#0E8A5F', name: 'בזיליקום' },
        { hex: '#7B3FE4', name: 'חציל' },
        { hex: '#2F5BEA', name: 'אוכמניות' }
    ];
    var SIZES = [
        { v: 0.9, name: 'קטן', px: 12 }, { v: 1, name: 'רגיל', px: 15 },
        { v: 1.12, name: 'גדול', px: 18 }, { v: 1.25, name: 'ענק', px: 21 }
    ];
    var STYLES = [
        { v: 'rounded', name: 'מעוגל', r: 12 }, { v: 'soft', name: 'רך', r: 7 }, { v: 'crisp', name: 'חד', r: 2 }
    ];
    var FIELDS = { mode: 'מצב תצוגה', accent: 'צבע הטעם', ts: 'גודל טקסט', ui: 'סגנון' };
    var root = document.documentElement;
    var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

    function read() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function write(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
    function effective(s) {
        return {
            mode: s.mode || (mq && mq.matches ? 'dark' : 'light'),
            accent: (s.accent || ACCENTS[0].hex).toUpperCase(),
            ts: +s.ts || 1,
            ui: s.ui || 'rounded'
        };
    }
    function copy(v) { return { mode: v.mode, accent: v.accent, ts: v.ts, ui: v.ui }; }
    function pick(list, key, v) { for (var i = 0; i < list.length; i++) if (String(list[i][key]).toUpperCase() === String(v).toUpperCase()) return list[i]; return list[0]; }
    function label(k, v) {
        if (k === 'mode') return v === 'dark' ? 'כהה' : 'בהיר';
        if (k === 'accent') return pick(ACCENTS, 'hex', v).name;
        if (k === 'ts') return pick(SIZES, 'v', v).name;
        return pick(STYLES, 'v', v).name;
    }
    function apply(v) {
        root.setAttribute('data-theme', v.mode);
        root.style.setProperty('--accent', v.accent);
        root.style.setProperty('--ts', v.ts);
        if (v.ui === 'rounded') root.removeAttribute('data-ui'); else root.setAttribute('data-ui', v.ui);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', v.mode === 'dark' ? '#140E0C' : '#FFF7F2');
    }

    var saved = effective(read());
    var draft = copy(saved);
    apply(saved);
    if (mq && mq.addEventListener) mq.addEventListener('change', function () {
        if (read().mode) return;
        saved.mode = effective(read()).mode; draft.mode = saved.mode; apply(draft); sync();
    });

    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
    var DROP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>';
    var TYPE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h11v2M9.5 5v14M7 19h5"/><path d="M14 12v-1h6v1M17 11v8M15.5 19h3"/></svg>';
    var SHAPE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/></svg>';
    var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    var PALETTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-.9 2-1.8 0-1.3-1-1.6-1-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.2" r="1.2" fill="currentColor"/><circle cx="15.2" cy="7.6" r="1.2" fill="currentColor"/></svg>';
    var X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    var BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
    var ICONS = { mode: SUN, accent: DROP, ts: TYPE, ui: SHAPE };

    var wrap = document.createElement('div');
    wrap.className = 'su-wrap'; wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML =
        '<div class="su-sheet" role="dialog" aria-modal="true" aria-label="המראה שלך">' +
            '<div class="su-top"><div class="su-grip"></div><div class="su-bar">' +
                '<button class="su-x" type="button" data-su="back" aria-label="חזרה" hidden>' + BACK + '</button>' +
                '<span class="su-compact" data-su="compact">המראה שלך</span>' +
                '<button class="su-x" type="button" data-su="close" aria-label="סגירה" style="margin-inline-start:auto">' + X + '</button>' +
            '</div></div>' +

            '<div class="su-panel" data-su="edit">' +
                '<div class="su-head"><div><h2>המראה שלך</h2><p>שיהיה טעים גם לעיניים.</p></div></div>' +
                '<div class="su-card su-preview" aria-hidden="true">' +
                    '<div class="su-pv-media"></div>' +
                    '<div class="su-pv-body">' +
                        '<span class="su-pv-chip">⏱ 12:40</span>' +
                        '<b>קפה שני על הבית</b><small>בזלת קפה · 4 דק׳ הליכה</small>' +
                        '<div class="su-pv-row"><span class="su-pv-tag">2 מקומות</span><span class="su-pv-cta">תופס!</span></div>' +
                    '</div>' +
                '</div>' +
                '<div class="su-label">מצב תצוגה <span data-su="modeVal"></span></div>' +
                '<div class="su-card"><div class="su-row">' +
                    '<span class="su-tile" data-su="modeIco"></span>' +
                    '<div class="su-txt"><b data-su="modeTitle"></b><small data-su="modeSub"></small></div>' +
                    '<button class="su-daynight" type="button" role="switch" aria-label="מצב כהה" data-su="mode">' +
                        '<span class="stars"><i></i><i></i><i></i></span><i class="thumb"></i></button>' +
                '</div></div>' +
                '<div class="su-label">צבע הטעם <span data-su="accentVal"></span></div>' +
                '<div class="su-card">' +
                    '<div class="su-swatches" role="radiogroup" aria-label="צבע">' +
                        ACCENTS.map(function (a) {
                            return '<button class="su-sw" type="button" role="radio" aria-label="' + a.name + '" data-hex="' + a.hex.toUpperCase() +
                                '" style="background:' + a.hex + ';--sw:' + a.hex + '">' + CHECK + '</button>';
                        }).join('') +
                    '</div>' +
                    '<div class="su-sw-names">' + ACCENTS.map(function (a) { return '<span data-hex="' + a.hex.toUpperCase() + '">' + a.name + '</span>'; }).join('') + '</div>' +
                '</div>' +
                '<div class="su-label">גודל טקסט <span data-su="tsVal"></span></div>' +
                '<div class="su-card su-opts four" role="radiogroup" aria-label="גודל טקסט">' +
                    SIZES.map(function (s) {
                        return '<button class="su-opt" type="button" role="radio" data-ts="' + s.v + '"><span class="aa" style="font-size:' + s.px + 'px">Aa</span><small>' + s.name + '</small></button>';
                    }).join('') +
                '</div>' +
                '<div class="su-label">סגנון <span data-su="uiVal"></span></div>' +
                '<div class="su-card su-opts three" role="radiogroup" aria-label="סגנון">' +
                    STYLES.map(function (s) {
                        return '<button class="su-opt" type="button" role="radio" data-ui="' + s.v + '"><span class="su-thumb" style="border-radius:' + s.r + 'px"><i style="border-radius:' + Math.max(2, s.r / 2) + 'px"></i></span><small>' + s.name + '</small></button>';
                    }).join('') +
                '</div>' +
                '<div class="su-label">חל על</div>' +
                '<div class="su-card"><div class="su-row">' +
                    '<span class="su-tile">' + DROP + '</span>' +
                    '<div class="su-txt"><b>כל המסכים</b><small data-su="summary"></small></div>' +
                '</div></div>' +
            '</div>' +

            '<div class="su-panel" data-su="review" hidden>' +
                '<div class="su-head"><div><h2>החוויה שלך</h2><p>רואים הכול יחד לפני ששומרים.</p></div></div>' +
                '<div class="su-label">השינויים <span data-su="reviewN"></span></div>' +
                '<div class="su-card su-list" data-su="reviewList"></div>' +
                '<button class="su-primary" type="button" data-su="commit">שמירת השינויים</button>' +
                '<button class="su-secondary" type="button" data-su="backBtn">חזרה לעריכה</button>' +
            '</div>' +
        '</div>';

    var bar = document.createElement('div');
    bar.className = 'su-pending';
    bar.innerHTML = '<i class="dot"></i><span class="n" data-su="n"></span>' +
        '<button class="discard" type="button">ביטול</button><button class="review" type="button">סקירה</button>';

    var toast = document.createElement('div');
    toast.className = 'su-toast';

    document.body.appendChild(wrap);
    document.body.appendChild(bar);
    document.body.appendChild(toast);

    var sheet = wrap.querySelector('.su-sheet');
    var top = wrap.querySelector('.su-top');
    function q(k) { return wrap.querySelector('[data-su="' + k + '"]'); }
    function changed() { return Object.keys(FIELDS).filter(function (k) { return String(draft[k]) !== String(saved[k]); }); }
    function countText(n) { return n === 1 ? 'שינוי אחד' : n + ' שינויים'; }
    var reviewing = false;

    function radios(sel, attr, val) {
        Array.prototype.forEach.call(wrap.querySelectorAll(sel), function (b) {
            b.setAttribute('aria-checked', String(b.getAttribute(attr)).toUpperCase() === String(val).toUpperCase() ? 'true' : 'false');
        });
    }
    function sync() {
        var dark = draft.mode === 'dark';
        q('mode').setAttribute('aria-checked', dark ? 'true' : 'false');
        q('modeIco').innerHTML = dark ? MOON : SUN;
        q('modeTitle').textContent = dark ? 'מצב כהה' : 'מצב בהיר';
        q('modeSub').textContent = dark ? 'הקישו בשביל אור יום' : 'הקישו כדי להחשיך';
        q('modeVal').textContent = label('mode', draft.mode);
        q('accentVal').textContent = label('accent', draft.accent);
        q('tsVal').textContent = label('ts', draft.ts);
        q('uiVal').textContent = label('ui', draft.ui);
        q('summary').textContent = [label('accent', draft.accent), 'טקסט ' + label('ts', draft.ts), label('ui', draft.ui)].join(' · ');
        radios('.su-sw', 'data-hex', draft.accent);
        radios('[data-ts]', 'data-ts', draft.ts);
        radios('.su-opt[data-ui]', 'data-ui', draft.ui);
        Array.prototype.forEach.call(wrap.querySelectorAll('.su-sw-names span'), function (s) {
            s.classList.toggle('on', s.getAttribute('data-hex') === draft.accent);
        });
        var n = changed().length;
        bar.querySelector('[data-su="n"]').textContent = countText(n);
        bar.classList.toggle('show', n > 0 && wrap.classList.contains('show') && !reviewing);
        if (!n && reviewing) panel(false);
    }
    function setDraft(k, v) {
        draft[k] = v;
        var go = function () { apply(draft); sync(); };
        if (k === 'mode' && document.startViewTransition) document.startViewTransition(go); else go();
    }
    function flash(t) {
        toast.textContent = t; toast.classList.add('show');
        clearTimeout(flash.t); flash.t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    }
    function onScroll() {
        var k = Math.max(0, Math.min(1, sheet.scrollTop / 60));
        Array.prototype.forEach.call(wrap.querySelectorAll('.su-panel:not([hidden]) .su-head'), function (h) {
            h.style.opacity = 1 - k; h.style.transform = 'translateY(' + (-6 * k) + 'px)';
        });
        q('compact').style.opacity = k;
        top.classList.toggle('scrolled', k > 0.02);
    }
    function panel(review) {
        reviewing = review;
        q('edit').hidden = review; q('review').hidden = !review;
        q('back').hidden = !review;
        q('compact').textContent = review ? 'החוויה שלך' : 'המראה שלך';
        if (review) {
            var list = changed();
            q('reviewN').textContent = countText(list.length);
            q('reviewList').innerHTML = list.map(function (k) {
                return '<div class="su-row"><span class="su-tile">' + ICONS[k] + '</span><div class="su-txt"><b>' + FIELDS[k] + '</b>' +
                    '<small><s>' + label(k, saved[k]) + '</s> ← <em>' + label(k, draft[k]) + '</em></small></div></div>';
            }).join('');
        }
        sheet.scrollTop = 0; onScroll(); sync();
    }
    function open() {
        document.body.classList.add('su-sheet-open');
        wrap.classList.add('show'); wrap.setAttribute('aria-hidden', 'false'); panel(false);
    }
    function discard() { draft = copy(saved); apply(saved); sync(); }
    function hide() {
        wrap.classList.remove('show'); wrap.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('su-sheet-open'); bar.classList.remove('show');
    }
    function close() { if (changed().length) discard(); hide(); }
    function commit() {
        saved = copy(draft);
        write(saved);
        hide(); reviewing = false; sync();
        flash('המראה נשמר · ' + label('accent', saved.accent));
    }

    sheet.addEventListener('scroll', onScroll, { passive: true });
    q('mode').addEventListener('click', function () { setDraft('mode', draft.mode === 'dark' ? 'light' : 'dark'); });
    Array.prototype.forEach.call(wrap.querySelectorAll('.su-sw'), function (b) {
        b.addEventListener('click', function () { setDraft('accent', b.getAttribute('data-hex')); });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('[data-ts]'), function (b) {
        b.addEventListener('click', function () { setDraft('ts', +b.getAttribute('data-ts')); });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.su-opt[data-ui]'), function (b) {
        b.addEventListener('click', function () { setDraft('ui', b.getAttribute('data-ui')); });
    });
    q('close').addEventListener('click', close);
    q('back').addEventListener('click', function () { panel(false); });
    q('backBtn').addEventListener('click', function () { panel(false); });
    q('commit').addEventListener('click', commit);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    bar.querySelector('.discard').addEventListener('click', discard);
    bar.querySelector('.review').addEventListener('click', function () { panel(true); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wrap.classList.contains('show')) close(); });

    var triggers = document.querySelectorAll('[data-su-open]');
    if (!triggers.length) {
        var f = document.createElement('button');
        f.type = 'button'; f.className = 'su-open su-float'; f.setAttribute('data-su-open', '');
        document.body.appendChild(f);
        triggers = [f];
    }
    Array.prototype.forEach.call(triggers, function (t) {
        if (!t.innerHTML.trim()) t.innerHTML = PALETTE;
        t.setAttribute('aria-label', 'המראה שלך');
        t.addEventListener('click', open);
    });
    sync();
})();
</script>
<!--/SUPER:sheet-->
</body>
</html>
